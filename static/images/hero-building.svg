<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bcd7f5"/>
      <stop offset="100%" stop-color="#eaf3fc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <ellipse cx="650" cy="90" rx="70" ry="22" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="120" cy="60" rx="55" ry="18" fill="#ffffff" opacity="0.7"/>
  <!-- ground -->
  <rect x="0" y="430" width="800" height="70" fill="#8fbf6f"/>
  <!-- main building -->
  <rect x="150" y="180" width="500" height="250" fill="#f5f2ea"/>
  <rect x="150" y="170" width="500" height="18" fill="#a3352f"/>
  <polygon points="130,180 400,120 670,180" fill="#8a2c27"/>
  <!-- columns -->
  <g fill="#ffffff" stroke="#d8d3c4">
    <rect x="190" y="220" width="18" height="180"/>
    <rect x="260" y="220" width="18" height="180"/>
    <rect x="330" y="220" width="18" height="180"/>
    <rect x="452" y="220" width="18" height="180"/>
    <rect x="522" y="220" width="18" height="180"/>
    <rect x="592" y="220" width="18" height="180"/>
  </g>
  <!-- windows -->
  <g fill="#7fa9d6">
    <rect x="215" y="235" width="35" height="55"/>
    <rect x="285" y="235" width="35" height="55"/>
    <rect x="480" y="235" width="35" height="55"/>
    <rect x="550" y="235" width="35" height="55"/>
  </g>
  <!-- door -->
  <rect x="375" y="300" width="50" height="100" fill="#5a3b26"/>
  <!-- seal on facade -->
  <circle cx="400" cy="200" r="16" fill="#f4c531" stroke="#0d3a86" stroke-width="2"/>
  <!-- flags -->
  <g>
    <rect x="230" y="150" width="3" height="70" fill="#555"/>
    <polygon points="233,150 265,158 233,166" fill="#e0332f"/>
    <rect x="300" y="150" width="3" height="70" fill="#555"/>
    <polygon points="303,150 335,158 303,166" fill="#0d3a86"/>
    <rect x="500" y="150" width="3" height="70" fill="#555"/>
    <polygon points="503,150 535,158 503,166" fill="#f4c531"/>
    <rect x="565" y="150" width="3" height="70" fill="#555"/>
    <polygon points="568,150 600,158 568,166" fill="#e0332f"/>
  </g>
  <!-- tent -->
  <polygon points="330,430 400,340 470,430" fill="#e8e4da"/>
  <polygon points="330,430 400,340 400,430" fill="#0d3a86"/>
  <polygon points="400,430 400,340 470,430" fill="#a3352f"/>
  <!-- palm trees -->
  <g>
    <rect x="105" y="330" width="10" height="100" fill="#6b4a2b"/>
    <path d="M110 330 Q70 300 60 340 M110 330 Q150 300 160 340 M110 330 Q80 280 100 250 M110 330 Q140 280 120 250" stroke="#3f7d3a" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="680" y="320" width="10" height="110" fill="#6b4a2b"/>
    <path d="M685 320 Q645 290 635 330 M685 320 Q725 290 735 330 M685 320 Q655 270 675 240 M685 320 Q715 270 695 240" stroke="#3f7d3a" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
</svg>
